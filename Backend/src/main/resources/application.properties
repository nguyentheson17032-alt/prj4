spring.application.name=backend

# Database Configuration - PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/playerduo_management
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Migration Configuration
# baseline-on-migrate=true cho phép chạy an toàn trên database đã có dữ liệu trước đó
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration


# (Tùy chọn) Nếu dùng MySQL thay thế, bỏ comment khối dưới:
# spring.datasource.url=jdbc:mysql://localhost:3306/playerduo_management?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh.expiration=604800000

# Server Configuration
server.port=8080

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# File upload configuration
file.upload-dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Firebase Cloud Messaging
fcm.server.key=${FCM_SERVER_KEY:}

# SMTP config for Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.mail.properties.mail.smtp.from=playerdou

# VNPay config
vnpay.tmnCode=${VNPAY_TMN_CODE}
vnpay.hashSecret=${VNPAY_HASH_SECRET}
vnpay.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=${VNPAY_RETURN_URL:http://localhost:8080/api/payments/vnpay-return}

# MoMo Payment Gateway Config
momo.partnerCode=${MOMO_PARTNER_CODE:MOMO_PLAYZONE}
momo.accessKey=${MOMO_ACCESS_KEY:MOMO_AK_PLAYZONE}
momo.secretKey=${MOMO_SECRET_KEY:MOMO_SK_PLAYZONE_SECURE_HMAC_KEY}
momo.endpoint=${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api/create}
momo.returnUrl=${MOMO_RETURN_URL:http://localhost:8080/api/payments/momo-return}
momo.notifyUrl=${MOMO_NOTIFY_URL:http://localhost:8080/api/payments/momo-ipn}

# ZaloPay Payment Gateway Config
zalopay.appId=${ZALOPAY_APP_ID:2553}
zalopay.key1=${ZALOPAY_KEY1:ZALOPAY_KEY1_SECRET}
zalopay.key2=${ZALOPAY_KEY2:ZALOPAY_KEY2_SECRET}
zalopay.endpoint=${ZALOPAY_ENDPOINT:https://sb-openapi.zalopay.vn/v2/create}
zalopay.returnUrl=${ZALOPAY_RETURN_URL:http://localhost:8080/api/payments/zalopay-return}

spring.web.resources.static-locations=classpath:/static/,file:uploads/

# Business Logic Configuration
# 1. Order Pending Auto-Expiry
app.order.pending-timeout-minutes=15

# 2. Dynamic Platform Commission Rates
app.platform.default-commission-rate=0.15
app.platform.vip-commission.standard=0.15
app.platform.vip-commission.silver=0.12
app.platform.vip-commission.gold=0.10
app.platform.vip-commission.diamond=0.08

# 3. Withdrawal Controls & KYC
app.withdraw.min-amount=50000
app.withdraw.max-per-request=20000000
app.withdraw.max-per-day=50000000
app.withdraw.require-kyc=true

# 4. Order Cancellation Policy
app.order.cancellation-free-hours=2
app.order.late-cancellation-fee-rate=0.30

# 5. Seed Accounts Configuration (An toàn, có thể ghi đè qua biến môi trường)
app.seed.enabled=${SEED_DATA_ENABLED:true}
app.seed.admin.username=${SEED_ADMIN_USERNAME:admin}
app.seed.admin.password=${SEED_ADMIN_PASSWORD:Admin@Secure123!}
app.seed.admin.email=${SEED_ADMIN_EMAIL:admin@playzone.vn}
app.seed.user.username=${SEED_USER_USERNAME:user123}
app.seed.user.password=${SEED_USER_PASSWORD:User@Secure123!}
app.seed.user.email=${SEED_USER_EMAIL:user123@playzone.vn}


