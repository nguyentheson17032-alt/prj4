spring.application.name=backend-test

# In-memory H2 Database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Flyway during tests so H2 creates schema from JPA
spring.flyway.enabled=false

# Test Secrets
jwt.secret=test_jwt_secret_key_12345678901234567890123456789012
jwt.expiration=86400000
jwt.refresh.expiration=604800000

# VNPay Test Config
vnpay.tmnCode=TESTCODE
vnpay.hashSecret=TESTSECRET1234567890
vnpay.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=http://localhost:8080/api/payments/vnpay-return

# Mail test config
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=noreply@example.com
spring.mail.password=testpassword

file.upload-dir=./test-uploads
